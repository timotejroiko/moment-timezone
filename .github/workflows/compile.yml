name: Compile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:

  update:
    name: Update tzdata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: step1
        name: Check for updates
        run: echo "RESULT=$(npm run check --silent)" >> $GITHUB_OUTPUT

      - name: Update tzdata
        if: steps.step1.outputs.RESULT == 'Update available'
        run: npm run compile

      - name: Commit changes
        if: steps.step1.outputs.RESULT == 'Update available'
        uses: stefanzweifel/git-auto-commit-action@v7

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compile.yml/enable" --silent; then
              echo "keepalive ok (attempt $i)"
              exit 0
            fi
            echo "keepalive attempt $i failed, retrying..."
            sleep 10
          done
          echo "keepalive failed after 3 attempts"
          exit 1
